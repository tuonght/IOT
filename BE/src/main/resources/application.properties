spring.application.name=BE

# MySQL connection (điền password của MySQL nếu có)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/iot?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Database schema
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=30m
server.error.include-message=always

# MQTT Configuration (Khớp 100% với ESP32)
app.mqtt.broker-uri=${MQTT_BROKER_URI:tcp://10.194.203.253:1884}
app.mqtt.username=tuonght
app.mqtt.password=12345678
app.mqtt.sensor-topic=${MQTT_SENSOR_TOPIC:iot/sensors/data}
app.mqtt.control-topic=${MQTT_CONTROL_TOPIC:iot/devices/control}
app.mqtt.status-topic=${MQTT_STATUS_TOPIC:iot/devices/status}
app.mqtt.reconnect-delay-ms=5000

# Frontend React
app.web.allowed-origin=${APP_WEB_ALLOWED_ORIGIN:http://localhost:5173}
app.frontend-url=${APP_FRONTEND_URL:http://localhost:5173}

# Flyway
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

